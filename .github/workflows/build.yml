name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit and ArchUnit tests, contentLint
        run: ./gradlew build contentLint --stacktrace
      - name: GameTest server
        run: ./gradlew runGameTestServer --stacktrace
      - name: Smoke
        run: ./gradlew smoke --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            build/libs/*.jar
            build/reports/
            runs/gameTestServer/logs/
